<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shakti Bank | Transfer Money</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="sidebar" id="sidebar"></nav>

    <div class="main-content">
        <header class="top-header" id="topHeader"></header>

        <div class="page-container">
            <h1 class="page-title">Transfer Money</h1>

            <div class="transfer-form-card">
                <form id="transferForm">
                    <div class="grid-2">
                        <div class="form-group">
                            <label>From Account</label>
                            <select class="form-control" id="fromAccountSelect">
                                <!-- Populated by JS -->
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Beneficiary Name</label>
                            <input type="text" class="form-control" id="bName" required
                                placeholder="Enter beneficiary name">
                        </div>

                        <div class="form-group">
                            <label>Beneficiary Account Number</label>
                            <input type="password" class="form-control" id="bAcc" required
                                placeholder="Enter account number">
                        </div>

                        <div class="form-group">
                            <label>Confirm Account Number</label>
                            <input type="text" class="form-control" id="cAcc" required
                                placeholder="Re-enter account number">
                        </div>

                        <div class="form-group">
                            <label>IFSC Code</label>
                            <input type="text" class="form-control" required placeholder="e.g. HDFC0001234">
                        </div>

                        <div class="form-group">
                            <label>Bank Name</label>
                            <input type="text" class="form-control" required placeholder="Enter bank name">
                        </div>

                        <div class="form-group">
                            <label>Transfer Type</label>
                            <select class="form-control" required>
                                <option value="IMPS">IMPS (Instant)</option>
                                <option value="NEFT">NEFT (2-4 hrs)</option>
                                <option value="RTGS">RTGS (Large amounts)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Transfer Amount (₹)</label>
                            <input type="number" class="form-control" id="tAmount" required min="1" placeholder="0.00">
                        </div>

                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Remarks / Note (Optional)</label>
                            <input type="text" class="form-control" placeholder="e.g. Rent, Bill payment">
                        </div>
                    </div>

                    <div style="display: flex; gap: 15px; margin-top: 20px;">
                        <button type="submit" class="btn">Proceed to Transfer</button>
                        <button type="reset" class="btn btn-outline">Reset Form</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content">
            <h3 style="color: var(--primary-color); margin-bottom: 20px; text-align: center;">Confirm Transfer</h3>

            <div style="background: var(--background-color); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <p style="margin-bottom: 10px;"><strong>To:</strong> <span id="mBenName"></span></p>
                <p style="margin-bottom: 10px;"><strong>Account:</strong> <span id="mAccNum"></span></p>
                <p style="font-size: 18px; text-align: center; margin-top: 15px;"><strong>Amount:</strong> <span
                        id="mAmount" style="color: var(--primary-color);"></span></p>
            </div>

            <p style="text-align: center; font-size: 14px; color: var(--text-light); margin-bottom: 20px;">Please ensure
                all details are correct. Transfers cannot be reversed.</p>

            <div style="display: flex; gap: 15px;">
                <button class="btn btn-outline" id="cancelTransfer">Cancel</button>
                <button class="btn" id="confirmTransfer">Confirm & Send</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script src="script.js"></script>
</body>

</html>
